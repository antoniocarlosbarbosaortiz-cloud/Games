<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte o Conselho Ideal — Agrolíderes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;min-height:100vh;padding:20px}
  h1{font-size:20px;font-weight:500;color:#1a1a1a;margin-bottom:4px}
  .subtitle{font-size:13px;color:#666;margin-bottom:20px}
  .status-bar{font-size:12px;color:#666;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 14px;margin-bottom:16px;min-height:38px;display:flex;align-items:center}
  .status-bar .sel{color:#854F0B;font-weight:500}

  /* Company cards */
  .companies-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .company-card{border-radius:14px;overflow:hidden;background:#fff;border:1.5px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .company-header{padding:12px 14px}
  .company-name{font-size:13px;font-weight:500;color:#fff;line-height:1.35;white-space:pre-line}
  .company-sub{font-size:9.5px;color:rgba(255,255,255,.75);margin-top:4px;line-height:1.5}
  .slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .slot{border:1.5px dashed #ccc;border-radius:8px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s;font-size:20px;color:#bbb;background:#fafafa}
  .slot:hover{border-color:#534AB7;background:#EEEDFE20}
  .slot.highlight{border-color:#EF9F27;background:#FAEEDA30}
  .slot.filled{border-style:solid;border-color:#ccc;background:#fff;font-size:10px}
  .slot-count{padding:0 8px 8px;font-size:10px;color:#888}

  /* Advisor cards */
  .advisors-label{font-size:11px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
  .advisors-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
  .advisor-card{border:1.5px solid #ddd;border-radius:12px;background:#fff;cursor:pointer;transition:.15s;overflow:hidden;user-select:none}
  .advisor-card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
  .advisor-card.selected{border:2.5px solid #EF9F27;transform:translateY(-6px);box-shadow:0 8px 20px rgba(239,159,39,.25)}
  .advisor-portrait{padding:8px 8px 4px;display:flex;justify-content:center}
  .portrait-circle{width:58px;height:58px;border-radius:50%;overflow:hidden}
  .advisor-info{padding:4px 8px 8px}
  .advisor-name{font-size:10.5px;font-weight:500;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
  .advisor-tags{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px}
  .tag{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:500}
  .advisor-bio{font-size:9px;color:#666;line-height:1.4}

  /* CTA */
  .cta-btn{width:100%;padding:14px;font-size:15px;font-weight:500;background:#1a1a1a;color:#fff;border:none;border-radius:10px;cursor:pointer;transition:.15s}
  .cta-btn:hover{background:#333}
  .cta-btn:disabled{background:#ccc;cursor:not-allowed}

  /* Results */
  .results-header{text-align:center;padding:1.5rem 0 1.25rem;background:#fff;border-radius:14px;border:1px solid #e0e0e0;margin-bottom:16px}
  .results-trophy{font-size:42px;margin-bottom:8px}
  .results-label{font-size:20px;font-weight:500;color:#1a1a1a}
  .results-score{font-size:36px;font-weight:500;margin-top:6px}
  .result-company{border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff}
  .result-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .result-company-name{font-size:13px;font-weight:500;color:#fff}
  .fit-badge{font-size:10px;padding:3px 12px;border-radius:20px;font-weight:500}
  .result-rows{padding:8px 12px}
  .result-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f0f0f0}
  .result-row:last-child{border-bottom:none}
  .result-portrait{width:30px;height:30px;min-width:30px;border-radius:50%;overflow:hidden;margin-top:2px}
  .result-name{font-size:11px;font-weight:500;color:#1a1a1a}
  .result-why{font-size:10px;color:#666;line-height:1.4;margin-top:2px}
  .result-pts{font-size:14px;font-weight:500;min-width:26px;text-align:right;margin-top:2px}
  .principle-box{border-left:3px solid #534AB7;padding:12px 16px;font-size:12px;color:#555;line-height:1.75;background:#EEEDFE20;border-radius:0 8px 8px 0;margin-bottom:16px}
  .btn-row{display:flex;gap:10px}
  .btn-secondary{flex:1;padding:12px;font-size:13px;background:#fff;border:1px solid #ddd;border-radius:10px;cursor:pointer;transition:.15s}
  .btn-secondary:hover{background:#f5f4f0}
  .header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .rabobank-label{font-size:11px;color:#888}
</style>
</head>

  {id:'cri',n:'Cristóvão Cricri',k:'#633806',tags:['Supervisionador','Detalhista','Riscos & Tributário'],bio:'Perfil supervisionador e detalhista. Experiência em gestão de riscos, controladoria e tributária. Visão microscópica: enxerga o que os outros não veem.'},
  {id:'lar',n:'Lara Abre-alas',k:'#72243E',tags:['Comunicadora','Agregadora','Lobbying & Pessoas'],bio:'Perfil comunicativo, agregador e de relacionamento. Experiência em gestão de pessoas e lobbying. Visão de satélite — ampla, conectada, estratégica.'},
  {id:'nes',n:'Nestor Fazedor',k:'#0C447C',tags:['Executor','Ouvinte','Finanças & Processos'],bio:'Perfil executor, ouvinte e priorizador. Experiência em finanças, gestão de riscos e processos. Visão macro com atenção micro — faz acontecer sem alardes.'},
  {id:'ter',n:'Tereza Viramesa',k:'#27500A',tags:['Estrategista','Reestruturação','Fusões & Aquisições'],bio:'Perfil executor e estrategista. Experiência em reestruturações, implantação de novas tecnologias, fusões e aquisições. Visão macro com capacidade de priorizar.'},
  {id:'tom',n:'Tomas Chegamais',k:'#412402',tags:['Conciliador','Comunicador','Operações & Tecnologia'],bio:'Perfil conciliador, comunicador e ouvinte. Experiência com operações e tecnologia. Visão micro com abertura para expandir o entendimento.'},
];

const COMPANIES = [
  {id:'rj',n:'Boi&Burro\nImplementos de\nTração Animal',sub:'Mercado em decadência · Alta alavancagem · Quadro de funcionários antigo',k:'#791F1F'},
  {id:'nv',n:'NovaTech',sub:'Startup de sistemas · IA para agricultura de precisão · Operacional positivo · Expansão acelerada · Grandes saltos de inovação à vista',k:'#085041'},
  {id:'cc',n:'CashCow Laticínios',sub:'Dominante nos seus mercados · Produtos e marcas bem consolidados · Resultados estáveis e robustos',k:'#0C447C'},
];

const SCORES = {
  rj:{ana:3,wad:0,gen:3,cri:3,lar:0,nes:3,ter:3,tom:0},
  nv:{ana:3,wad:2,gen:0,cri:1,lar:2,nes:3,ter:1,tom:3},
  cc:{ana:3,wad:3,gen:0,cri:1,lar:3,nes:2,ter:0,tom:3},
};

const WHY = {
  rj:{
    ana:'Processos, tecnologia e priorização: moderniza as operações enquanto enfrenta a crise. Combinação certeira.',
    wad:'Visão macro e diplomacia não salvam uma empresa em colapso que exige execução e decisões duras.',
    gen:'Executor implacável, focado em resultados e transformações difíceis. Nasceu para turnarounds como este.',
    cri:'Controle de riscos e precisão tributária são críticos numa empresa alavancada que não pode errar.',
    lar:'Comunicação ajuda com os funcionários antigos, mas não resolve a crise estrutural e financeira.',
    nes:'Finanças + execução + visão macro com atenção micro: combo ideal para reestruturar caixa e operações.',
    ter:'Especialista em reestruturações, M&A e novas tecnologias. O perfil mais indicado para esta virada.',
    tom:'Perfil conciliador é valioso, mas a urgência da situação exige decisões duras, não apenas consenso.',
  },
  nv:{
    ana:'Estrutura de sistemas, tecnologia e priorização: essencial para escalar a agtech com governança sólida.',
    wad:'Rede institucional e regulatória contribui para parcerias e posicionamento no agronegócio digital.',
    gen:'Rígido demais para o dinamismo e a cultura ágil de uma empresa em hipercrescimento.',
    cri:'Supervisão excessiva pode travar a velocidade de inovação que a NovaTech precisa manter.',
    lar:'Gestão de talentos e lobbying são úteis para atrair equipes e parceiros estratégicos.',
    nes:'Finanças para o crescimento: mantém as contas saudáveis e a disciplina enquanto a empresa acelera.',
    ter:'Reestruturação não é o que uma empresa em ascensão precisa — risco de desacelerar o momentum.',
    tom:'Operações, tecnologia e abertura para aprender: conecta o chão de fábrica à estratégia de crescimento.',
  },
  cc:{
    ana:'Processos, tecnologia incremental e priorização: otimiza operações já azeitadas sem criar turbulência.',
    wad:'Relações institucionais e visão macro protegem o domínio de mercado e abrem novas frentes estratégicas.',
    gen:'Perfil disruptivo é contraproducente numa cash cow que precisa de estabilidade e previsibilidade.',
    cri:'Controle de riscos contribui, mas a empresa precisa mais de marcas fortes do que de fiscalização intensiva.',
    lar:'Comunicação, lobbying e gestão de pessoas: fortalece marcas consolidadas e o relacionamento com o canal.',
    nes:'Finanças e processos são competentes, mas não o diferencial central que esta empresa de marcas precisa.',
    ter:'Reestruturar onde não se precisa é arriscado — pode destruir valor numa empresa que funciona muito bem.',
    tom:'Conciliação, operações e tecnologia incremental: mantém ritmo, qualidade e harmonia no ecossistema.',
  },
};

let page = 0; // 0=intro, 1=game
let slots = { rj:[null,null,null,null], nv:[null,null,null,null], cc:[null,null,null,null] };
let selectedAdv = null;

function adv(id) { return ADVISORS.find(a => a.id === id); }
function isComplete() { return Object.values(slots).every(s => s.every(x => x)); }

function selectAdv(id) {
  selectedAdv = selectedAdv === id ? null : id;
  render();
}

function clickSlot(co, si) {
  if (slots[co][si]) {
    slots[co][si] = null;
  } else if (selectedAdv) {
    slots[co][si] = selectedAdv;
  }
  render();
}

function renderIntro() {
  document.getElementById('game-root').innerHTML = `
    <div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0">

      <!-- Branding topo -->
      <div style="margin-bottom:32px">
        <div style="font-size:22px;font-weight:700;color:#1a1a1a;letter-spacing:.3px">Rabobank Brasil · Agrolíderes</div>
        <div style="width:60px;height:3px;background:#EF9F27;margin:10px auto"></div>
        <div style="font-size:17px;font-weight:500;color:#333;margin-top:8px">Carlos Ortiz</div>
        <div style="font-size:13px;color:#888;margin-top:3px">antonio.carlos.barbosa.ortiz@gmail.com</div>
      </div>

      <!-- Título do jogo -->
      <div style="background:#fff;border-radius:16px;border:1.5px solid #e0e0e0;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:40px 48px;max-width:680px;width:100%">
        <div style="font-size:26px;font-weight:700;color:#1a1a1a;margin-bottom:6px">Monte o Conselho Ideal</div>
        <div style="font-size:14px;color:#888;margin-bottom:28px">Exercício interativo de governança corporativa</div>

        <!-- Contexto -->
        <div style="text-align:left;margin-bottom:24px">
          <div style="font-size:12px;font-weight:700;color:#534AB7;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">📋 Contexto</div>
          <div style="font-size:13.5px;color:#333;line-height:1.8">
            Você é assessor de empresas familiares que buscam organizar um <strong>Conselho Consultivo</strong> composto por sócios familiares e membros independentes.<br><br>
            Há <strong>oito candidatos</strong> a conselheiros independentes com grande experiência profissional e referências muito positivas. Seu desafio: escolher os <strong>4 mais indicados</strong> para cada uma das três empresas a seguir.
          </div>
        </div>

        <!-- Divisor -->
        <div style="border-top:1px solid #eee;margin-bottom:24px"></div>

        <!-- Instruções -->
        <div style="text-align:left;margin-bottom:28px">
          <div style="font-size:12px;font-weight:700;color:#534AB7;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">🎮 Como Jogar</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;gap:12px;align-items:flex-start">
              <div style="min-width:26px;height:26px;background:#534AB7;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">1</div>
              <div style="font-size:13.5px;color:#333;line-height:1.6;padding-top:3px">Leia o perfil de cada candidato na seção <strong>Conselheiros disponíveis</strong>.</div>
            </div>
            <div style="display:flex;gap:12px;align-items:flex-start">
              <div style="min-width:26px;height:26px;background:#534AB7;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">2</div>
              <div style="font-size:13.5px;color:#333;line-height:1.6;padding-top:3px"><strong>Clique na carta</strong> do conselheiro que deseja selecionar — ela ficará com borda dourada.</div>
            </div>
            <div style="display:flex;gap:12px;align-items:flex-start">
              <div style="min-width:26px;height:26px;background:#534AB7;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">3</div>
              <div style="font-size:13.5px;color:#333;line-height:1.6;padding-top:3px">Em seguida, <strong>clique no slot</strong> (espaço vazio) da empresa onde deseja posicioná-lo.</div>
            </div>
            <div style="display:flex;gap:12px;align-items:flex-start">
              <div style="min-width:26px;height:26px;background:#534AB7;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">4</div>
              <div style="font-size:13.5px;color:#333;line-height:1.6;padding-top:3px">Repita até preencher os <strong>4 conselheiros</strong> de cada empresa. O mesmo candidato pode integrar mais de um conselho.</div>
            </div>
          </div>
        </div>

        <!-- CTA -->
        <button onclick="page=1;render()" style="width:100%;padding:16px;font-size:16px;font-weight:600;background:#1a1a1a;color:#fff;border:none;border-radius:12px;cursor:pointer;letter-spacing:.3px">
          Iniciar Jogo →
        </button>
      </div>
    </div>
  `;
}

function render() {
  if (page === 0) { renderIntro(); return; }
  const done = isComplete();
  const root = document.getElementById('game-root');

  const gameHeader = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div>
      <div style="font-size:15px;font-weight:700;color:#1a1a1a">Monte o Conselho Ideal</div>
      <div style="font-size:11px;color:#888">Rabobank Brasil · Agrolíderes · Carlos Ortiz</div>
    </div>
    <button onclick="page=0;render()" style="font-size:11px;padding:6px 12px;background:#fff;border:1px solid #ddd;border-radius:8px;cursor:pointer;color:#666">← Instruções</button>
  </div>`;

  const statusMsg = selectedAdv
    ? `<span class="sel">✦ ${adv(selectedAdv).n}</span>&nbsp; selecionado — clique em um slot para posicionar · clique no conselheiro novamente para cancelar`
    : 'Selecione um conselheiro abaixo e clique no slot de uma empresa para posicioná-lo. O mesmo conselheiro pode estar em vários conselhos.';

  const companiesHTML = COMPANIES.map((c, ci) => {
    const filled = slots[c.id].filter(x => x).length;
    const slotsHTML = slots[c.id].map((sid, si) => {
      if (sid) {
        const a = adv(sid);
        return `<div class="slot filled" onclick="clickSlot('${c.id}',${si})" title="Clique para remover ${a.n}">
          <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;border:1.5px solid ${a.k}40">${P[sid]}</div>
          <div style="font-size:8px;font-weight:500;color:#444;text-align:center;line-height:1.2;max-width:62px;margin-top:2px">${a.n.split(' ').slice(0,2).join(' ')}</div>
        </div>`;
      }
      const hl = selectedAdv ? ' highlight' : '';
      return `<div class="slot${hl}" onclick="clickSlot('${c.id}',${si})">+</div>`;
    }).join('');

    return `<div class="company-card">
      <div class="company-header" style="background:${c.k}">
        <div class="company-name">${c.n}</div>
        <div class="company-sub">${c.sub}</div>
      </div>
      <div class="slots-grid">${slotsHTML}</div>
      <div class="slot-count">${filled}/4 conselheiros</div>
    </div>`;
  }).join('');

  const advisorsHTML = ADVISORS.map(a => {
    const isSel = selectedAdv === a.id;
    const tagsHTML = a.tags.map(t =>
      `<span class="tag" style="background:${a.k}18;color:${a.k}">${t}</span>`
    ).join('');
    return `<div class="advisor-card${isSel ? ' selected' : ''}" onclick="selectAdv('${a.id}')" style="border-color:${isSel ? '#EF9F27' : a.k+'40'}">
      <div class="advisor-portrait" style="background:${a.k}10">
        <div class="portrait-circle" style="border:2px solid ${a.k}30">${P[a.id]}</div>
      </div>
      <div class="advisor-info">
        <div class="advisor-name">${a.n}</div>
        <div class="advisor-tags">${tagsHTML}</div>
        <div class="advisor-bio">${a.bio}</div>
      </div>
    </div>`;
  }).join('');

  root.innerHTML = `
    ${gameHeader}
    <div class="status-bar">${statusMsg}</div>
    <div class="companies-grid">${companiesHTML}</div>
    <div class="advisors-label">Conselheiros disponíveis — podem integrar múltiplos conselhos</div>
    <div class="advisors-grid">${advisorsHTML}</div>
    ${done ? `<button class="cta-btn" onclick="showResults()">Revelar análise dos conselhos →</button>` : `<button class="cta-btn" disabled>Complete os 3 conselhos para ver o resultado (${Object.values(slots).flat().filter(x=>x).length}/12)</button>`}
  `;
}

function showResults() {
  let total = 0;
  const details = COMPANIES.map(c => {
    let cscore = 0;
    const rows = slots[c.id].map(sid => {
      const pts = SCORES[c.id][sid];
      cscore += pts;
      return { sid, pts };
    });
    total += cscore;
    return { c, cscore, rows };
  });

  const pct = Math.round(total / 36 * 100);
  const ov = pct >= 80 ? { l:'Mestre em Governança', s:'🏆' }
           : pct >= 65 ? { l:'Governança Sólida', s:'🥈' }
           : pct >= 50 ? { l:'Em Desenvolvimento', s:'📚' }
                       : { l:'Muito a Aprender', s:'🌱' };

  const fitLbl = s => s >= 10 ? { l:'Excelente fit', k:'#085041', bg:'#E1F5EE' }
                   : s >= 7  ? { l:'Bom fit',       k:'#0C447C', bg:'#E6F1FB' }
                   : s >= 4  ? { l:'Razoável',       k:'#854F0B', bg:'#FAEEDA' }
                             : { l:'Fit fraco',      k:'#791F1F', bg:'#FCEBEB' };
  const ptClr = p => p===3?'#085041':p===2?'#0C447C':p===1?'#854F0B':'#791F1F';

  const detailsHTML = details.map(({ c, cscore, rows }) => {
    const f = fitLbl(cscore);
    const rowsHTML = rows.map(({ sid, pts }) => {
      const a = adv(sid);
      return `<div class="result-row">
        <div class="result-portrait" style="border:1.5px solid ${a.k}30">${P[sid]}</div>
        <div style="flex:1;min-width:0">
          <div class="result-name">${a.n}</div>
          <div class="result-why">${WHY[c.id][sid]}</div>
        </div>
        <div class="result-pts" style="color:${ptClr(pts)}">${pts}/3</div>
      </div>`;
    }).join('');

    return `<div class="result-company">
      <div class="result-header" style="background:${c.k}">
        <div class="result-company-name">${c.n.replace('\n',' ')}</div>
        <span class="fit-badge" style="background:${f.bg};color:${f.k}">${f.l} · ${cscore}/12</span>
      </div>
      <div class="result-rows">${rowsHTML}</div>
    </div>`;
  }).join('');

  const scoreColor = pct >= 65 ? '#085041' : pct >= 50 ? '#854F0B' : '#791F1F';

  document.getElementById('game-root').innerHTML = `
    <div class="results-header">
      <div class="results-trophy">${ov.s}</div>
      <div class="results-label">${ov.l}</div>
      <div class="results-score" style="color:${scoreColor}">${total}<span style="font-size:16px;color:#888">/36 pts</span></div>
    </div>
    ${detailsHTML}
    <div class="principle-box">
      <strong style="color:#1a1a1a">Lembre-se:</strong> elha ótima sempre existe — e ela depende do contexto, dos desafios e do momento de cada empresa. As combinações mais valiosas <em>neste momento</em>. O mesmo conselheiro brilhante pode ser inadequado em outro contexto.
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="page=0;slots={rj:[null,null,null,null],nv:[null,null,null,null],cc:[null,null,null,null]};selectedAdv=null;render()">↺ Jogar novamente</button>
      <button class="btn-secondary" onclick="window.print()">Imprimir resultado</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
